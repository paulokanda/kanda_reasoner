<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">Local AI home workshop</title><desc id="desc">A home workshop computer serving local models while an unplugged cloud remains outside.</desc>

<style>
