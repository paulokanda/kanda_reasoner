<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">Config AI use and safety bridge</title><desc id="desc">A bridge from global AI settings to a selected project conversation with a human approval gate.</desc>

<style>
.text{font-family:"Segoe Print","Comic Sans MS",cursive;fill:#0d0d1a}
.label{font-family:"Segoe Print","Comic Sans MS",cursive;font-weight:800;letter-spacing:.4px}
.ink{stroke:#0d0d1a;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke:#0d0d1a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.hatch{stroke:#64748b;stroke-width:2.4;stroke-linecap:round;opacity:.7}
</style>

