workspace_root = "."
required-version = "==0.15.21"
target-version = "py310"
workspace_root = "."
line-length = 88
indent-width = 4
force-exclude = true
respect-gitignore = true
preview = false
fix = false
unsafe-fixes = false
show-fixes = true
src = ["."]

[lint]
extend-select = ["E501"]
preview = false

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
preview = false
